name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  schedule:
    - cron: '29 7 * * 6'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Il frontend React.
          - language: javascript-typescript
            build-mode: none
          # Il backoffice Django in euscitojoypad_db/.
          - language: python
            build-mode: none
          # Il bot Discord in discord-bot/: è l'unico linguaggio compilato,
          # l'autobuilder trova da solo il go.mod.
          - language: go
            build-mode: autobuild
          # I workflow in .github/workflows/ stessi.
          - language: actions
            build-mode: none
        # Il backend OCaml non è analizzabile: CodeQL non supporta OCaml.
        # Linguaggi supportati: https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: security-extended,security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

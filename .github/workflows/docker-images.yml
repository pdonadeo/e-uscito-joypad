name: Build Docker images and push to registry
on:
  #push:
  #  branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
jobs:
  push:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Se una delle tre immagini fallisce, le altre due vengono comunque
      # buildate e pushate.
      fail-fast: false
      matrix:
        include:
          - name: Dream
            context: .
            image: e-uscito-joypad
          - name: Django
            context: ./euscitojoypad_db/
            image: e-uscito-joypad-db
          - name: Discord bot
            context: ./discord-bot/
            image: e-uscito-joypad-bot
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Docker Metadata action
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # generate Docker tags based on the following events/attributes
          # Lo schema dei tag di questo repo (v40, v41, …) non è semver, quindi
          # `type=semver` non produrrebbe nulla e loggherebbe solo un warning:
          # le immagini sono identificate dallo sha del commit, che per un
          # deploy manuale è quello che serve.
          tags: |
            type=sha
      -
        name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope separato per immagine: i tre job girano in parallelo e con lo
          # scope di default (`buildkit`) si sovrascriverebbero la cache a vicenda.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

version: 2
updates:
  # Sito pubblico e backoffice /bo (React, Bun)
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # graphql-request 7 accetta solo graphql 14-16.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]

  # Test Playwright alla radice
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Stessa major di graphql del frontend (vedi /frontend).
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]

  # Workflow di GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

---
version: "3.7"
services:
  balancer:
    depends_on:
      - "app"
    image: nginx:stable-alpine
    container_name: "euj-balancer-prod"
    networks:
      - euj_prod
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./media:/usr/share/nginx/html/bo/files
      - ./infra/nginx/conf.d:/etc/nginx/conf.d

  # PostgreSQL
  postgresql:
    image: postgres:15-alpine
    container_name: "euj-postgresql-prod"
    networks:
      - euj_prod
    ports:
      - "127.0.0.1:15432:5432"
    env_file: ./compose_env_prod
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/:/docker-entrypoint-initdb.d/

  # È uscito Joypad? (Backend Dream + React SPA)

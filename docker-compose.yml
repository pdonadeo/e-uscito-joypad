---
services:
  balancer:
    depends_on:
      - "app"
    image: nginx:stable-alpine
    container_name: "euj-balancer"
    networks:
      - euj
    ports:
      - "5000:80"
    volumes:
      - ./media:/usr/share/nginx/html/bo/files
      - ./infra/nginx/conf.d:/etc/nginx/conf.d

  # PostgreSQL
  postgresql:
    image: postgres:15-alpine
    container_name: "euj-postgresql"
    networks:
      - euj
    env_file: ./compose_env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/:/docker-entrypoint-initdb.d/
    #command: postgres -c 'log_statement=all' -c 'log_min_messages=INFO'
    ports:
      - 5432:5432

  # È uscito Joypad? (Backend Dream + React SPA)
  app:
    image: ghcr.io/pdonadeo/e-uscito-joypad:latest
    depends_on:
      - "postgresql"
    container_name: "euj-app"
    build: ./
    networks:
      - euj
    environment:
      PGHOST: "postgresql"
      PGPORT: "5432"
      MEDIA_ROOT: "/media"
    env_file: ./compose_env
    volumes:
      - ./media:/media

  # Discord bot (Go)
  bot:
    image: ghcr.io/pdonadeo/e-uscito-joypad-bot:latest
    depends_on:
      - "postgresql"
    container_name: "euj-bot"
    build: ./discord-bot/
    networks:
      - euj
    environment:
      PGHOST: "postgresql"
      PGPORT: "5432"
    env_file: ./compose_env

volumes:
  postgres-data:
    driver: local

networks:
  euj:
    name: euj
